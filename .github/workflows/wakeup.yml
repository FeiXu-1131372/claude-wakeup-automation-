name: Claude Wake-Up Automation

on:
  schedule:
    - cron: '7 17 * * *'  # 06:07 NZDT (17:07 UTC prev day)
  workflow_dispatch:  # Allow manual triggering

jobs:
  wakeup:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Credentials
        run: mkdir -p ~/.claude && echo '{"claudeAiOauth":{"accessToken":"${{ secrets.CLAUDE_OAUTH_TOKEN }}","refreshToken":"${{ secrets.CLAUDE_OAUTH_TOKEN }}","scopes":["user:inference","user:profile"],"subscriptionType":"pro"}}' > ~/.claude/.credentials.json && chmod 600 ~/.claude/.credentials.json

      - name: Send Wake-Up Message
        run: |
          # Array of simple, low-token prompts (~1% quota usage)
          PROMPTS=(
            "What's 2+2?"
            "Say hello in three words."
            "Tell me a random number."
            "What day is today?"
            "Name one programming language."
          )
          # Select random prompt
          SELECTED_PROMPT=${PROMPTS[$RANDOM % ${#PROMPTS[@]}]}
          claude -p "$SELECTED_PROMPT"

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit if repo inactive >50 days
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS_SINCE=$(( (NOW - LAST_COMMIT) / 86400 ))
          if [ "$DAYS_SINCE" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent workflow auto-disable"
            git push
          else
            echo "Last commit was ${DAYS_SINCE} days ago, no keepalive needed."
          fi
