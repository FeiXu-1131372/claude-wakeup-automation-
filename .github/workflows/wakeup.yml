name: Claude Wake-Up Automation

on:
  schedule:
    - cron: '7 17 * * *'  # 06:07 NZDT (17:07 UTC prev day)
  workflow_dispatch:  # Allow manual triggering

jobs:
  wakeup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.39

      - name: Verify Claude CLI Version
        run: claude --version

      - name: Configure Claude Authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_OAUTH_TOKEN is empty or unavailable in this workflow run."
            exit 1
          fi

          if [[ "${CLAUDE_CODE_OAUTH_TOKEN}" != sk-ant-oat01-* ]]; then
            echo "CLAUDE_OAUTH_TOKEN does not look like a Claude OAuth token."
            exit 1
          fi

          # Write credentials via Node to avoid JSON/newline escaping problems.
          mkdir -p ~/.claude
          node -e "const fs=require('fs');const p=process.env.CLAUDE_CODE_OAUTH_TOKEN;const out={claudeAiOauth:{accessToken:p,refreshToken:p,scopes:['user:inference','user:profile'],subscriptionType:'pro'}};fs.writeFileSync(process.env.HOME+'/.claude/.credentials.json',JSON.stringify(out));"
          chmod 600 ~/.claude/.credentials.json

          # Verify we wrote valid JSON credentials (version-safe; no auth subcommand dependency).
          node -e "const fs=require('fs'); const p=process.env.HOME+'/.claude/.credentials.json'; JSON.parse(fs.readFileSync(p,'utf8')); console.log('credentials_json_valid=true');"

      - name: Send Wake-Up Message
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          # Array of simple, low-token prompts (~1% quota usage)
          PROMPTS=(
            "What's 2+2?"
            "Say hello in three words."
            "Tell me a random number."
            "What day is today?"
            "Name one programming language."
          )
          # Select random prompt
          SELECTED_PROMPT=${PROMPTS[$RANDOM % ${#PROMPTS[@]}]}
          claude -p "$SELECTED_PROMPT"

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit if repo inactive >50 days
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS_SINCE=$(( (NOW - LAST_COMMIT) / 86400 ))
          if [ "$DAYS_SINCE" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent workflow auto-disable"
            git push
          else
            echo "Last commit was ${DAYS_SINCE} days ago, no keepalive needed."
          fi
