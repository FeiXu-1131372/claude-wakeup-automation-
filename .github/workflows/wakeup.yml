name: Claude Wake-Up Automation

on:
  schedule:
    - cron: '0 17 * * *'  # 06:00 NZDT (17:00 UTC prev day)
    - cron: '0 22 * * *'  # 11:00 NZDT (22:00 UTC prev day)
    - cron: '0 3 * * *'   # 16:00 NZDT (03:00 UTC)
    - cron: '0 8 * * *'   # 21:00 NZDT (08:00 UTC)
  workflow_dispatch:  # Allow manual triggering

jobs:
  wakeup:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Credentials
        run: mkdir -p ~/.claude && echo '{"claudeAiOauth":{"accessToken":"${{ secrets.CLAUDE_OAUTH_TOKEN }}","refreshToken":"${{ secrets.CLAUDE_OAUTH_TOKEN }}","scopes":["user:inference","user:profile"],"subscriptionType":"pro"}}' > ~/.claude/.credentials.json && chmod 600 ~/.claude/.credentials.json

      - name: Send Wake-Up Message
        run: |
          # Array of simple, low-token prompts (~1% quota usage)
          PROMPTS=(
            "What's 2+2?"
            "Say hello in three words."
            "Tell me a random number."
            "What day is today?"
            "Name one programming language."
          )
          # Select random prompt
          SELECTED_PROMPT=${PROMPTS[$RANDOM % ${#PROMPTS[@]}]}
          claude -p "$SELECTED_PROMPT"

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 50
